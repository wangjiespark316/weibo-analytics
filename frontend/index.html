            </div>
          </div>

        </div>

        <!-- 设置 -->
        <div class="topbar-icon-btn" title="系统设置" onclick="Router.navigate('api-key');closeDropdowns()">
          <svg width="18" height="18" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M36.686 15.171C37.9364 16.9643 38.8163 19.0352 39.2147 21.2727H44V26.7273H39.2147C38.8163 28.9648 37.9364 31.0357 36.686 32.829L40.0706 36.2137L36.2137 40.0706L32.829 36.686C31.0357 37.9364 28.9648 38.8163 26.7273 39.2147V44H21.2727V39.2147C19.0352 38.8163 16.9643 37.9364 15.171 36.686L11.7863 40.0706L7.92939 36.2137L11.314 32.829C10.0636 31.0357 9.18372 28.9648 8.78533 26.7273H4V21.2727H8.78533C9.18372 19.0352 10.0636 16.9643 11.314 15.171L7.92939 11.7863L11.7863 7.92939L15.171 11.314C16.9643 10.0636 19.0352 9.18372 21.2727 8.78533V4H26.7273V8.78533C28.9648 9.18372 31.0357 10.0636 32.829 11.314L36.2137 7.92939L40.0706 11.7863L36.686 15.171Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M24 29C26.7614 29 29 26.7614 29 24C29 21.2386 26.7614 19 24 19C21.2386 19 19 21.2386 19 24C19 26.7614 21.2386 29 24 29Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg>

          <div class="user-avatar">王</div>
          <div class="user-detail">
            <div class="user-name">王杰</div>
            <div class="user-role">管理员</div>
          </div>
          <svg class="user-arrow" width="12" height="12" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M24 42V6" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M36 30L24 42L12 30" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <!-- 用户下拉菜单 -->
        <div class="dropdown-menu" id="dropdown-user">
          <div class="dropdown-user-header">
            <div class="user-avatar" style="width:40px;height:40px;font-size:16px;">王</div>
            <div>
              <div style="font-weight:600;font-size:14px;">王杰</div>
              <div style="font-size:12px;color:var(--text-secondary);">wangjie@example.com</div>
            </div>
          </div>
          <div class="dropdown-list">
            <div class="dropdown-item" onclick="Router.navigate('api-key');closeDropdowns()">
              <span class="dropdown-item-icon-text"><svg class="ip-ico" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M22.8682 24.2982C25.4105 26.7935 26.4138 30.4526 25.4971 33.8863C24.5805 37.32 21.8844 40.0019 18.4325 40.9137C14.9806 41.8256 11.3022 40.8276 8.79375 38.2986C5.02208 34.4141 5.07602 28.2394 8.91499 24.4206C12.754 20.6019 18.9613 20.5482 22.8664 24.3L22.8682 24.2982Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M23 24L40 7" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M30.3052 16.9001L35.7337 22.3001L42.0671 16.0001L36.6385 10.6001L30.3052 16.9001Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg></span>
              <span>API Key 管理</span>
            </div>
            <div class="dropdown-item" onclick="Router.navigate('user-mgmt');closeDropdowns()">
              <span class="dropdown-item-icon-text"><svg class="ip-ico" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M24 20C27.866 20 31 16.866 31 13C31 9.13401 27.866 6 24 6C20.134 6 17 9.13401 17 13C17 16.866 20.134 20 24 20Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 40.8V42H42V40.8C42 36.3196 42 34.0794 41.1281 32.3681C40.3611 30.8628 39.1372 29.6389 37.6319 28.8719C35.9206 28 33.6804 28 29.2 28H18.8C14.3196 28 12.0794 28 10.3681 28.8719C8.86278 29.6389 7.63893 30.8628 6.87195 32.3681C6 34.0794 6 36.3196 6 40.8Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
              <span>用户管理</span>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- 主体布局 -->
    <div class="main-layout">
      <!-- 左侧菜单 -->
      <aside class="sidebar" id="sidebar">
        <nav class="menu" id="menu">
          <!-- 菜单由 JS 动态渲染 -->
        </nav>
      </aside>

      <!-- 内容区域 -->
      <main class="content" id="content">
        <!-- 页面内容由 JS 动态渲染 -->
        <div class="page-loading">
          <div class="loading-spinner"></div>
          <span>加载中...</span>
        </div>
      </main>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- 详情抽屉 -->
  <div class="drawer-mask" id="drawerMask" onclick="closeDrawer()"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <span class="drawer-title" id="drawerTitle">详情</span>
      <button class="drawer-close" onclick="closeDrawer()">×</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </div>

  
  <!-- 双运行模式：默认旧版稳定，?mode=modular启用模块化架构 -->
  <script>
    // 检测运行模式
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode');
    window.APP_MODE = mode === 'modular' ? 'modular' : 'legacy';
    console.log('[Bootstrap] Running in', window.APP_MODE, 'mode');
    
    if (window.APP_MODE === 'modular') {
      // 模块化模式：加载核心模块 + API模块 + 页面模块 + 启动器
      document.write(`
        <!-- 核心模块 -->
        <script src="/src/core/app-context.js"><\/script>
        <script src="/src/core/module-loader.js"><\/script>
        <script src="/src/core/error-handler.js"><\/script>
        
        <!-- API模块 -->
        <script src="/src/api/base.js"><\/script>
        <script src="/src/api/events.js"><\/script>
        <script src="/src/api/products.js"><\/script>
        <script src="/src/api/trends.js"><\/script>
        <script src="/src/api/reports.js"><\/script>
        <script src="/src/api/sales.js"><\/script>
        <script src="/src/api/workspace.js"><\/script>
        <script src="/src/api/weibo.js"><\/script>
        
        <!-- 组件模块 -->
        <script src="/src/components/empty-state.js"><\/script>
        <script src="/src/components/error-state.js"><\/script>
        
        <!-- 工具和状态 -->
        <script src="/src/utils/page_cache.js"><\/script>
        <script src="/src/store.js"><\/script>
        
        <!-- 页面模块 -->
        <script src="/src/pages/dashboard.js"><\/script>
        <script src="/src/pages/weibo_data.js"><\/script>
        <script src="/src/pages/user_data.js"><\/script>
        <script src="/src/pages/hot_data.js"><\/script>
        <script src="/src/pages/sentiment.js"><\/script>
        <script src="/src/pages/trend.js"><\/script>
        <script src="/src/pages/daily_report.js"><\/script>
        <script src="/src/pages/collect_task.js"><\/script>
        <script src="/src/pages/analyze_task.js"><\/script>
        <script src="/src/pages/cron_task.js"><\/script>
        <script src="/src/pages/api_key.js"><\/script>
        <script src="/src/pages/user_mgmt.js"><\/script>
        <script src="/src/pages/permission.js"><\/script>
        <script src="/src/pages/events.js"><\/script>
        <script src="/src/pages/products.js"><\/script>
        <script src="/src/pages/trends.js"><\/script>
        <script src="/src/pages/reports.js"><\/script>
        <script src="/src/pages/sales.js"><\/script>
        <script src="/src/pages/workspace_customers.js"><\/script>
        <script src="/src/pages/workspace_customer_detail.js"><\/script>
        <script src="/src/pages/workspace_tasks.js"><\/script>
        
        <!-- 旧版app.js（提供Components、Router等基础对象） -->
        <script src="/app.js?v=realdata20260919b"><\/script>
        
        <!-- 模块化启动器 -->
        <script src="/app.modular.js"><\/script>
      `);
    } else {
      // 默认模式：加载旧版app.js（稳定）
      document.write('<script src="/app.js?v=realdata20260919b"><\/script>');
    }
  </script>

</body>
</html>
